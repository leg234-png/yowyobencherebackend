spring.application.name=yowyob-enchere-backend-reactive

springdoc.api-docs.path=/api-docs

server.port=8031
spring.webflux.base-path=/api

spring.main.allow-bean-definition-overriding=true

# --- Configuration R2DBC ---
spring.r2dbc.url=r2dbc:mysql://157.90.26.3:3307/${DB_NAME:enchereyowyob}?serverTimezone=UTC
spring.r2dbc.username=${DB_USERNAME:root}
spring.r2dbc.password=${DB_PASSWORD:Azerty123}

# --- Configuration de la source de données JDBC pour Flyway ---
spring.datasource.url=jdbc:mysql://157.90.26.3:3307/enchereyowyob?serverTimezone=UTC&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Azerty123}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1.0
spring.flyway.baseline-description=Initial version
spring.flyway.ignore-migration-patterns=*:ignored
spring.flyway.enabled=true

# --- Configuration du Serveur de Ressources JWT ---
# URL pour récupérer les clés publiques JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:https://auth.yowyob.com/.well-known/jwks.json}
# URL de l'issuer JWT (optionnel mais recommandé pour la validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://auth.yowyob.com}

# --- Configuration des services externes ---
# Service d'authentification
app.auth-service.base-url=${AUTH_SERVICE_URL:http://157.90.26.3:8032/api/user}
# Service utilisateur
app.user-service.base-url=${USER_SERVICE_URL:http://157.90.26.3:8032/api/user}


# --- Configuration du pool de connexions ---
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# --- Configuration de l'upload de fichiers ---
app.upload.path=${UPLOAD_PATH:uploads/}
app.upload.base-url=${UPLOAD_BASE_URL:http://157.90.26.3:8031/api/uploads/}